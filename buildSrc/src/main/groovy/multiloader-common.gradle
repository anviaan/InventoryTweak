plugins {
    id 'java-library'
    id 'maven-publish'
}

base {
    archivesName = "${mod_id}-${project.name}-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    withSourcesJar()
    withJavadocJar()
}

repositories {
    mavenCentral()
    exclusiveContent {
        forRepository {
            maven {
                name = 'Sponge'
                url = 'https://repo.spongepowered.org/repository/maven-public'
            }
        }
        filter { includeGroupAndSubgroups('org.spongepowered') }
    }
    maven {
        name = 'Anvian'
        url = 'https://maven.anvian.net/releases'
    }
    maven {
        name = 'Shedaniel'
        url = 'https://maven.shedaniel.me/'
    }
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/'
        mavenContent { includeGroup 'com.terraformersmc' }
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        mavenContent { includeGroup 'maven.modrinth' }
    }
    maven {
        name = 'JitPack'
        url = 'https://jitpack.io'
        mavenContent { includeGroupByRegex 'com.github.*' }
    }
}

sourcesJar {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${mod_name}" }
    }
}

jar {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${mod_name}" }
    }
    manifest {
        attributes([
                'Specification-Title'   : mod_name,
                'Specification-Vendor'  : mod_author,
                'Specification-Version' : project.jar.archiveVersion,
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_author,
                'Built-On-Minecraft'    : minecraft_version
        ])
    }
}

processResources {
    def expandProps = [
            'version'                      : version,
            'group'                        : project.group,
            'minecraft_version'            : minecraft_version,
            'minecraft_version_range'      : minecraft_version_range,
            'fabric_version'               : fabric_version,
            'fabric_loader_version'        : fabric_loader_version,
            'mod_name'                     : mod_name,
            'mod_author'                   : mod_author,
            'mod_id'                       : mod_id,
            'license'                      : license,
            'description'                  : project.property('description'),
            'neoforge_version'             : neoforge_version,
            'neoforge_loader_version_range': neoforge_loader_version_range,
            'credits'                      : credits,
            'java_version'                 : java_version,
            'anvianslib_version'           : anvianslib_version,
            'cloth_config_version'         : cloth_config_version,
            'modmenu_version'              : modmenu_version
    ]
    def jsonExpandProps = expandProps.collectEntries { key, value ->
        [(key): value instanceof String ? value.replace('\\n', '\\\\n') : value]
    }

    filesMatching(['META-INF/neoforge.mods.toml']) { expand expandProps }
    filesMatching(['pack.mcmeta', 'fabric.mod.json', '*.mixins.json']) { expand jsonExpandProps }
    inputs.properties(expandProps)
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = base.archivesName.get()
            from components.java
        }
    }
    repositories {
        maven {
            name = 'Reposilite'
            url = uri(version.toString().endsWith('SNAPSHOT')
                    ? 'https://maven.anvian.net/snapshots'
                    : 'https://maven.anvian.net/releases')
            credentials {
                username = project.findProperty('reposilite.user') ?: System.getenv('REPOSILITE_USER')
                password = project.findProperty('reposilite.token') ?: System.getenv('REPOSILITE_TOKEN')
            }
        }
    }
}
