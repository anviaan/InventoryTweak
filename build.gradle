plugins {
    id 'fabric-loom' version '1.11-SNAPSHOT' apply false
    id 'net.neoforged.moddev' version '2.0.115' apply false
}

group = project.group
version = project.version

allprojects {
    repositories {
        mavenCentral()
        maven {
            name = 'Repsy Anvian'
            url = uri('https://repo.repsy.io/mvn/anvian/anvians-lib')
            mavenContent { includeGroup 'net.anvian.anvianslib' }
        }
        maven {
            name = 'Shedaniel'
            url = uri('https://maven.shedaniel.me/')
            mavenContent { includeGroup 'me.shedaniel.cloth' }
        }
        maven {
            name = 'TerraformersMC'
            url = uri('https://maven.terraformersmc.com/')
            mavenContent { includeGroup 'com.terraformersmc' }
        }
        maven {
            url = 'https://libraries.minecraft.net'
            content { includeModule('org.lwjgl', 'lwjgl-freetype') }
        }
    }
}

tasks.register('build') {
    group = 'build'
    description = 'Build all loader distributions.'
}

tasks.register('clean') {
    group = 'build'
    description = 'Clean all loader distributions.'
}

gradle.projectsEvaluated {
    tasks.named('build') {
        dependsOn subprojects.collect { it.tasks.named('build') }
    }
    tasks.named('clean') {
        dependsOn subprojects.collect { it.tasks.named('clean') }
    }
}

tasks.register('printEnv') {
    doLast {
        def values = [
                MOD_VERSION  : project.version.toString(),
                RELEASE_NAME : "${mod_id}-${project.version}",
                GAME_VERSIONS: minecraft_version_range.toString()
        ]
        values.each { key, value ->
            println "${key}=${value}"
            def githubEnv = System.getenv('GITHUB_ENV')
            if (githubEnv != null) {
                new File(githubEnv).append("${key}=${value}\n")
            }
        }
    }
}
